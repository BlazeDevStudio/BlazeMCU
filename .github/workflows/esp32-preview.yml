name: ESP32 Starter Preview

on:
  push:
    branches: ["feature/blazemcu-esp-starter"]
  pull_request:
    paths:
      - "main/**"
      - "common/**"
      - "CMakeLists.txt"
      - "sdkconfig.defaults"
      - "partitions.csv"
      - "tests/**"
      - ".github/workflows/esp32-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute native pin policy
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Imain main/board_caps.c main/lab_policy.c tests/policy_test.c -o /tmp/blaze-policy
          /tmp/blaze-policy
          cc -std=c11 -Wall -Wextra -Werror tests/pwm_policy_test.c -o /tmp/blaze-pwm-policy
          /tmp/blaze-pwm-policy
          cc -std=c11 -Wall -Wextra -Werror -Imain main/board_caps.c main/lab_policy.c main/i2c_policy.c tests/i2c_policy_test.c -o /tmp/blaze-i2c-policy
          /tmp/blaze-i2c-policy
          cc -std=c11 -Wall -Wextra -Werror tests/oled_pattern_test.c -o /tmp/blaze-oled-pattern
          /tmp/blaze-oled-pattern
      - name: Validate partition table, web assets, routes and UI contracts
        run: |
          python3 -m unittest discover -s tests -v
          node --check main/web/app.js

  build-esp32:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.6
    steps:
      - uses: actions/checkout@v4
      - name: Compile ESP32 firmware (not a hardware test)
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py set-target esp32
          idf.py build
      - name: Check binary size against OTA partition
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          path = "build/blazemcu_esp_starter.bin"
          size = os.path.getsize(path)
          limit = 0x120000
          print(f"Image size: {size} / {limit} bytes")
          assert size <= limit, "Application exceeds intended OTA slot"
          PY
      - name: Upload explicitly unverified firmware build
        uses: actions/upload-artifact@v4
        with:
          name: BlazeMCU-ESP32-PREVIEW-UNVERIFIED
          path: |
            build/blazemcu_esp_starter.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
          if-no-files-found: error
          retention-days: 7

  ui-browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Playwright test runner
        run: npm install --prefix tests/ui --no-audit --no-fund --no-package-lock
      - name: Install Chromium for deterministic mock-API UI tests
        run: ./tests/ui/node_modules/.bin/playwright install --with-deps chromium
      - name: Exercise desktop and 390px mobile UI (simulated API, no hardware)
        run: ./tests/ui/node_modules/.bin/playwright test --config=tests/ui/playwright.config.cjs
