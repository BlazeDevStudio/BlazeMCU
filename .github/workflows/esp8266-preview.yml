name: ESP8266 Starter Preview

on:
  push:
    branches: ["feature/blazemcu-esp-starter"]
    paths:
      - "esp8266/**"
      - "common/**"
      - "docs/OLED.md"
      - "docs/UART.md"
      - "main/web/**"
      - "tests/esp8266_policy_test.cpp"
      - "tests/pwm_policy_test.c"
      - "tests/test_repository.py"
      - "tests/ui/**"
      - "docs/ESP8266.md"
      - "README.md"
      - ".github/workflows/esp8266-preview.yml"
  pull_request:
    paths:
      - "esp8266/**"
      - "common/**"
      - "docs/OLED.md"
      - "docs/UART.md"
      - "main/web/**"
      - "tests/esp8266_policy_test.cpp"
      - "tests/pwm_policy_test.c"
      - "tests/test_repository.py"
      - "tests/ui/**"
      - "docs/ESP8266.md"
      - "README.md"
      - ".github/workflows/esp8266-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  esp8266-pin-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test ESP8266 pin permission model (host only)
        run: |
          c++ -std=c++11 -Wall -Wextra -Werror tests/esp8266_policy_test.cpp -o /tmp/blaze8266-policy
          /tmp/blaze8266-policy
          cc -std=c11 -Wall -Wextra -Werror tests/pwm_policy_test.c -o /tmp/blaze-pwm-policy
          /tmp/blaze-pwm-policy
          cc -std=c11 -Wall -Wextra -Werror tests/oled_pattern_test.c -o /tmp/blaze-oled-pattern
          /tmp/blaze-oled-pattern
      - name: Validate shared UI contracts and JavaScript syntax
        run: |
          python3 -m unittest discover -s tests -v
          node --check main/web/app.js

  esp8266-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [nodemcuv2, d1_mini]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO Core
        run: python -m pip install platformio==6.1.18
      - name: Compile firmware for selected board (not a hardware test)
        run: pio run -d esp8266 -e ${{ matrix.board }}
      - name: Check generated image size
        run: |
          python - <<'PY'
          from pathlib import Path
          board = "${{ matrix.board }}"
          image = Path("esp8266/.pio/build") / board / "firmware.bin"
          size = image.stat().st_size
          print(f"{board}: {size} bytes; NOT HARDWARE VERIFIED")
          assert 0 < size < 0x100000, "Unexpected image for 4 MB reference board"
          PY
      - name: Upload PREVIEW / UNVERIFIED image
        uses: actions/upload-artifact@v4
        with:
          name: BlazeMCU-ESP8266-${{ matrix.board }}-PREVIEW-UNVERIFIED
          path: esp8266/.pio/build/${{ matrix.board }}/firmware.bin
          if-no-files-found: error
          retention-days: 7
