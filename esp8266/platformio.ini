[platformio]
default_envs = nodemcuv2, d1_mini

[env]
platform = espressif8266@4.2.1
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@^6.21.5
extra_scripts = pre:scripts/embed_web.py
build_flags = -DBLAZE_PREVIEW=1

[env:nodemcuv2]
board = nodemcuv2
build_flags = ${env.build_flags} -DBLAZE_NODEMCU=1

[env:d1_mini]
board = d1_mini
build_flags = ${env.build_flags} -DBLAZE_D1_MINI=1
